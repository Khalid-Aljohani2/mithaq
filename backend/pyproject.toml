[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares query and header parameters as argument defaults. B008 reads
# that as a function call in a default, which is exactly the intended idiom.
"app/routers/*.py" = ["B008"]
# The docstring holds an ASCII reference table of the contract breakdown;
# wrapping it would make it unreadable, which is the opposite of the point.
"eval/build_cases.py" = ["E501"]
# Prompt generators embed markdown tables as string literals; wrapping them
# would corrupt the table the model actually reads.
"scripts/write_prompts*.py" = ["E501"]
# Test helpers legitimately take **kwargs of mixed type.
"tests/*.py" = ["ANN401"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# NFR-01 demands full branch coverage of the rules module specifically.
addopts = [
    "--cov=app.services.rules_engine",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
