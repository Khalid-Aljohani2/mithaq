[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# NFR-01 demands full branch coverage of the rules module specifically.
addopts = [
    "--cov=app.services.rules_engine",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
